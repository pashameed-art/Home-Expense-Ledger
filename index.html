<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Expense Ledger">
<link rel="manifest" href="./manifest.json">
<title>Home Expense Ledger V5.2</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--soft:#eef2f7;--accent:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(145deg,#0b1220,#182337);color:#fff;padding:20px 18px 22px;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.version{font-size:11px;padding:5px 8px;border:1px solid #ffffff30;border-radius:999px}.sub{font-size:12px;color:#aab4c5;margin-top:4px}
.hero{margin-top:20px}.heroLabel{font-size:12px;color:#aab4c5}.heroAmount{font-size:36px;font-weight:850}.heroBottom{display:flex;justify-content:space-between;color:#cbd5e1;font-size:12px}
main{max-width:760px;margin:auto;padding:16px 15px 30px}.card{background:#fff;border:1px solid #edf0f4;border-radius:22px;padding:17px;margin-bottom:14px;box-shadow:0 7px 24px #1018280a}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:18px;font-weight:800}.pill{font-size:11px;background:var(--soft);padding:6px 9px;border-radius:999px;color:var(--muted);font-weight:700}
label{display:block;font-size:12px;font-weight:750;color:#344054;margin:10px 0 6px}input,select{width:100%;height:48px;border:1px solid var(--line);background:#fafbfc;border-radius:13px;padding:0 13px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;height:48px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;margin-top:12px}.btn.light{background:#eef1f5;color:#101828}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.icon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center}.main{min-width:0;flex:1}.name{font-weight:800;font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:3px}.right{text-align:right}.amt{font-weight:850}.del{border:0;background:#fff1f2;color:#b42318;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:750;margin-top:5px}
.report{background:#f8fafc;border-radius:16px;padding:13px;margin-top:12px}.big{font-size:26px;font-weight:850}.cat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.cat:last-child{border:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{text-align:center;color:var(--muted);padding:22px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<header>
<div class="top"><div><div class="brand">🏠 Home Expense Ledger</div><div class="sub">Simple • Private • Organized</div></div><div class="version">V5.2</div></div>
<div class="hero"><div class="heroLabel">TOTAL EXPENSE</div><div class="heroAmount" id="total">₹0</div><div class="heroBottom"><span id="count">0 entries</span><span>Local &amp; private</span></div></div>
</header>
<main>
<section class="card"><div class="head"><div class="title">Add Expense</div><div class="pill">QUICK ENTRY</div></div>
<form id="form"><label>Date</label><input id="date" type="date" required><label>Expense</label><input id="expense" placeholder="What did you spend on?" required>
<div class="grid2"><div><label>Category</label><select id="category"><option>Grocery</option><option>Vegetables</option><option>Fuel</option><option>EB / Electricity</option><option>Water</option><option>Mobile / Recharge</option><option>House Maintenance</option><option>Medical</option><option>Car</option><option>Travel</option><option>Clothing</option><option>Food / Hotel</option><option>Other</option></select></div><div><label>Amount</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="₹ 0" required></div></div>
<label>Notes <span style="color:#98a2b3">(optional)</span></label><input id="notes" placeholder="Optional note"><button class="btn">+ Add Expense</button></form></section>

<section class="card">
<div class="head"><div class="title">📊 Expense Report</div><div class="pill">V5.2</div></div>
<div class="grid2">
 <div><label>From Date</label><input id="from" type="date"></div>
 <div><label>To Date</label><input id="to" type="date"></div>
</div>
<div class="grid2" style="margin-top:4px">
 <button class="btn light" id="view" type="button">View Report</button>
 <button class="btn" id="pdf" type="button">📄 Export PDF</button>
</div>
<div id="report" style="display:block"></div>
</section>

<section class="card"><div class="head"><div class="title">Recent Expenses</div><div class="pill" id="listTotal">₹0</div></div><div id="list"></div></section>

<section class="card"><div class="head"><div class="title">💾 Data Safety</div><div class="pill">SAFE BACKUP</div></div>
<div class="actions"><button class="btn light" id="backup" type="button">Backup JSON</button><button class="btn light" id="restore" type="button">Restore JSON</button></div>
<input id="file" type="file" accept=".json,application/json" hidden><p><small>Backup before major updates. Data remains in this device browser storage.</small></p></section>
</main>
<script>
const KEY="homeExpenseLedgerV1",$=x=>document.getElementById(x),money=n=>"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[]}catch(e){data=[]}
const today=new Date().toISOString().slice(0,10);$("date").value=today;$("to").value=today;$("from").value=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
const emo={Grocery:"🛒",Vegetables:"🥬",Fuel:"⛽","EB / Electricity":"💡",Water:"💧","Mobile / Recharge":"📱","House Maintenance":"🏠",Medical:"💊",Car:"🚗",Travel:"🚌",Clothing:"👕","Food / Hotel":"🍽️",Other:"📦"};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();report()}
function render(){let t=data.reduce((s,e)=>s+Number(e.amount||0),0);$("total").textContent=money(t);$("listTotal").textContent=money(t);$("count").textContent=data.length+" "+(data.length===1?"entry":"entries");let b=$("list");b.innerHTML="";if(!data.length){b.innerHTML='<div class="empty">No expenses yet.</div>';return}[...data].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).forEach(e=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="icon">${emo[e.category]||"💰"}</div><div class="main"><div class="name">${esc(e.expense)}</div><div class="meta">${esc(e.date)} • ${esc(e.category)}${e.notes?" • "+esc(e.notes):""}</div></div><div class="right"><div class="amt">${money(e.amount)}</div><button class="del" onclick="del('${e.id}')">Delete</button></div>`;b.appendChild(d)})}
window.del=id=>{if(confirm("Delete this expense?")){data=data.filter(e=>e.id!==id);save()}}
function report(){
 const a=$("from").value,b=$("to").value;
 if(a&&b&&a>b){$("report").innerHTML='<div class="report" style="color:#b42318">From date cannot be after To date.</div>';return}
 const rows=data.filter(e=>(!a||e.date>=a)&&(!b||e.date<=b));
 const total=rows.reduce((s,e)=>s+Number(e.amount||0),0),cats={};
 rows.forEach(e=>cats[e.category]=(cats[e.category]||0)+Number(e.amount||0));
 let o='<div class="report" style="margin-top:12px"><div style="font-size:12px;color:#667085">'+rows.length+' entries</div><div class="big">'+money(total)+'</div>';
 if(rows.length){
   o+='<div style="margin-top:12px;font-weight:800;font-size:13px">Category-wise Total</div>';
   Object.entries(cats).sort((x,y)=>y[1]-x[1]).forEach(([k,v])=>o+='<div class="cat"><span>'+esc(k)+'</span><b>'+money(v)+'</b></div>');
 }
 o+='</div>';
 $("report").innerHTML=o;
}

$("form").onsubmit=e=>{e.preventDefault();let n=Number($("amount").value);if(!Number.isFinite(n)||n<0)return;data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:$("date").value,expense:$("expense").value.trim(),category:$("category").value,amount:n,notes:$("notes").value.trim()});save();e.target.reset();$("date").value=new Date().toISOString().slice(0,10);$("expense").focus()}
$("view").addEventListener("click",report);$("from").addEventListener("change",report);$("to").addEventListener("change",report);
$("pdf").onclick=()=>{
 let a=$("from").value,b=$("to").value;
 if(a&&b&&a>b){alert("From date cannot be after To date.");return}
 let rows=data.filter(e=>(!a||e.date>=a)&&(!b||e.date<=b));
 if(!rows.length){alert("No expenses found for the selected date range.");return}
 if(!window.jspdf){alert("PDF library is still loading. Please try again.");return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
 const total=rows.reduce((s,e)=>s+Number(e.amount||0),0),cats={};
 rows.forEach(e=>cats[e.category]=(cats[e.category]||0)+Number(e.amount||0));
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("Home Expense Ledger V5.2",14,16);
 doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(`From: ${a||"All"}    To: ${b||"All"}`,14,23);
 doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(`Total Expense: Rs. ${Number(total).toLocaleString("en-IN",{maximumFractionDigits:2})}`,14,31);
 const body=[...rows].sort((x,y)=>(x.date+x.id).localeCompare(y.date+y.id)).map(e=>[
   e.date||"",e.expense||"",e.category||"",
   Number(e.amount||0).toLocaleString("en-IN",{maximumFractionDigits:2}),
   e.notes||""
 ]);
 doc.autoTable({
   startY:37,
   head:[["Date","Expense","Category","Amount","Notes"]],
   body,
   theme:"grid",
   styles:{font:"helvetica",fontSize:8,cellPadding:2.3,valign:"middle",overflow:"linebreak"},
   headStyles:{fontStyle:"bold",halign:"center"},
   columnStyles:{0:{cellWidth:24,halign:"center"},1:{cellWidth:39},2:{cellWidth:32},3:{cellWidth:28,halign:"right"},4:{cellWidth:55}},
   margin:{left:14,right:14}
 });
 let y=doc.lastAutoTable.finalY+9;
 if(y>270){doc.addPage();y=18}
 doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Category-wise Total",14,y);
 y+=5;
 doc.autoTable({
   startY:y,head:[["Category","Total"]],body:Object.entries(cats).sort((x,y)=>y[1]-x[1]).map(([k,v])=>[k,Number(v).toLocaleString("en-IN",{maximumFractionDigits:2})]),
   theme:"grid",styles:{font:"helvetica",fontSize:8,cellPadding:2.3},
   headStyles:{fontStyle:"bold"},columnStyles:{0:{cellWidth:80},1:{cellWidth:40,halign:"right"}},margin:{left:14,right:14}
 });
 doc.save("Home-Expense-Report.pdf");
};
$("backup").onclick=()=>{let blob=new Blob([JSON.stringify({app:"Home Expense Ledger",version:"4.0",exportedAt:new Date().toISOString(),entries:data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="home-expense-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("restore").onclick=()=>$("file").click();
$("file").onchange=async e=>{
 let f=e.target.files[0]; if(!f)return;
 try{
   let j=JSON.parse(await f.text()), x=Array.isArray(j)?j:j.entries;
   if(!Array.isArray(x))throw 0;
   const map=new Map(data.map(v=>[String(v.id),v]));
   let added=0,updated=0;
   x.forEach(v=>{
     if(!v||v.id==null)return;
     const k=String(v.id);
     if(map.has(k)){map.set(k,v);updated++}else{map.set(k,v);added++}
   });
   data=[...map.values()];
   save();
   alert("Backup restored safely.\nAdded: "+added+"\nUpdated: "+updated+"\nExisting entries were not deleted.");
 }catch{alert("Invalid backup file.")} e.target.value="";
}
render();report();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>
</body></html>
