<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Expense Ledger">
<link rel="manifest" href="./manifest.json">
<title>Home Expense Ledger V5.14</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--soft:#eef2f7;--accent:#111827;--accent2:#243b64}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eef3f9 0%,#f7f9fc 55%,#f3f6fb 100%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(145deg,#0a1220 0%,#18263d 58%,#263e66 100%);color:#fff;padding:18px 17px 20px;border-radius:0 0 30px 30px;box-shadow:0 10px 30px #10182822}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:21px;font-weight:850;letter-spacing:-.3px}
.version{font-size:10px;padding:6px 10px;border:1px solid #ffffff38;border-radius:999px;background:#ffffff12;color:#e7edf8;font-weight:750}
.sub{font-size:11px;color:#b8c4d6;margin-top:4px}
main{max-width:760px;margin:auto;padding:15px 14px 32px}
.card{background:rgba(255,255,255,.97);border:1px solid #e8ecf2;border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 8px 25px #10182810}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}
.title{font-size:18px;font-weight:850;letter-spacing:-.2px}
.pill{font-size:10px;background:#f0f3f8;padding:6px 9px;border-radius:999px;color:#596579;font-weight:800;white-space:nowrap}
label{display:block;font-size:12px;font-weight:800;color:#344054;margin:10px 0 6px}
input,select{width:100%;height:48px;border:1px solid #dfe4ec;background:#fbfcfe;border-radius:13px;padding:0 13px;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus{border-color:#7287ad;background:#fff;box-shadow:0 0 0 4px #7287ad18}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;height:48px;border:0;border-radius:13px;background:linear-gradient(135deg,#111827,#263a5e);color:#fff;font-size:15px;font-weight:850;margin-top:12px;box-shadow:0 6px 14px #1118271a;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(1px);box-shadow:0 3px 8px #11182718}
.btn.light{background:#eef2f7;color:#172033;box-shadow:none}
.item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #edf0f4}
.item:last-child{border:0}
.icon{width:43px;height:43px;flex:0 0 43px;border-radius:13px;background:linear-gradient(145deg,#f1f4f9,#e8edf5);display:grid;place-items:center;font-size:20px}
.main{min-width:0;flex:1}
.name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;min-width:76px}
.amt{font-weight:850;font-size:14px}
.del{border:0;background:#fff1f2;color:#b42318;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:800;margin-top:5px}
.report{background:#f8fafc;border:1px solid #edf0f4;border-radius:16px;padding:13px;margin-top:12px;box-shadow:inset 0 1px 0 #fff}
.report table{font-size:13px}
.report th{font-weight:850;color:#344054}
.report td{color:#475467}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.empty{text-align:center;color:var(--muted);padding:22px}
@media(max-width:520px){
  main{padding:12px 11px 28px}
  .card{padding:15px;border-radius:18px}
  .grid2{gap:8px}
  .title{font-size:17px}
  .brand{font-size:20px}
  input,select,.btn{height:47px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<header>
<div class="top"><div><div class="brand">🏠 Home Expense Ledger</div><div class="sub">Simple • Private • Organized</div></div><div class="version">V5.14</div></div>
</header>
<main>
<section class="card"><div class="head"><div class="title">Add Expense</div><div class="pill">QUICK ENTRY</div></div>
<form id="form"><label>Date</label><input id="date" type="date" required><label>Expense</label><input id="expense" placeholder="What did you spend on?" required>
<div class="grid2"><div><label>Category</label><select id="category"><option>Car</option><option>Clothing</option><option>EB / Electricity</option><option>Food / Hotel</option><option>Fuel</option><option>Grocery</option><option>House Maintenance</option><option>Household / Home Expense</option><option>Medical</option><option>Mobile / Recharge</option><option>Other</option><option>Property Tax / House Tax</option><option>Travel</option><option>Vegetables</option><option>Water</option></select></div><div><label>Amount</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="₹ 0" required></div></div>
<label>Notes <span style="color:#98a2b3">(optional)</span></label><input id="notes" placeholder="Optional note"><button class="btn">+ Add Expense</button></form></section>

<section class="card">
<div class="head"><div class="title">📊 Expense Report</div></div>
<div class="grid2">
 <div><label>From Date</label><input id="from" type="date"></div>
 <div><label>To Date</label><input id="to" type="date"></div>
</div>
<div class="grid2" style="margin-top:4px">
 <button class="btn light" id="view" type="button" onclick="window.generateExpenseReport()">View Report</button>
 <button class="btn light" id="clearReport" type="button">Clear Report</button>
</div>
<div class="grid2" style="margin-top:0">
 <button class="btn" id="pdf" type="button">📄 Export PDF</button>
 <div></div>
</div>
<div id="report" style="display:block"></div>
</section>

<section class="card"><div class="head"><div class="title">Recent Expenses</div><div class="pill" id="listTotal">₹0</div></div><div id="list"></div></section>

<section class="card"><div class="head"><div class="title">💾 Data Safety</div><div class="pill">SAFE BACKUP</div></div>
<div class="actions"><button class="btn light" id="backup" type="button">Backup JSON</button><button class="btn light" id="restore" type="button">Restore JSON</button></div>
<input id="file" type="file" accept=".json,application/json" hidden><p><small>Backup before major updates. Data remains in this device browser storage.</small></p></section>
</main>
<script>
const KEY="homeExpenseLedgerV1",$=x=>document.getElementById(x),money=n=>"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[]}catch(e){data=[]}
const today=new Date().toISOString().slice(0,10);$("date").value=today;$("to").value=today;$("from").value=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
const emo={Grocery:"🛒","Household / Home Expense":"🏠","Property Tax / House Tax":"🏛️",Vegetables:"🥬",Fuel:"⛽","EB / Electricity":"💡",Water:"💧","Mobile / Recharge":"📱","House Maintenance":"🏠",Medical:"💊",Car:"🚗",Travel:"🚌",Clothing:"👕","Food / Hotel":"🍽️",Other:"📦"};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();report()}
function render(){let t=data.reduce((s,e)=>s+Number(e.amount||0),0);$("total").textContent=money(t);$("listTotal").textContent=money(t);$("count").textContent=data.length+" "+(data.length===1?"entry":"entries");let b=$("list");b.innerHTML="";if(!data.length){b.innerHTML='<div class="empty">No expenses yet.</div>';return}[...data].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).forEach(e=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="icon">${emo[e.category]||"💰"}</div><div class="main"><div class="name">${esc(e.expense)}</div><div class="meta">${esc(e.date)} • ${esc(e.category)}${e.notes?" • "+esc(e.notes):""}</div></div><div class="right"><div class="amt">${money(e.amount)}</div><button class="del" onclick="del('${e.id}')">Delete</button></div>`;b.appendChild(d)})}
const HOME_EXPENSE="வீட்டு செலவு";
function syncExpenseForCategory(){
  const cat=$("category"), exp=$("expense");
  if(cat.value==="Household / Home Expense"){
    exp.value=HOME_EXPENSE;
    exp.dataset.autofilled="1";
  }else if(exp.dataset.autofilled==="1" && exp.value===HOME_EXPENSE){
    exp.value="";
    delete exp.dataset.autofilled;
  }
}
$("category").addEventListener("change",syncExpenseForCategory);
$("expense").addEventListener("input",()=>{delete $("expense").dataset.autofilled});
window.del=id=>{if(confirm("Delete this expense?")){data=data.filter(e=>e.id!==id);save()}}
window.generateExpenseReport=function report(){
 const a=$("from").value,b=$("to").value;
 if(a&&b&&a>b){
   $("report").innerHTML='<div class="report" style="color:#b42318">From date cannot be after To date.</div>';
   return;
 }
 const rows=data
   .filter(e=>(!a||e.date>=a)&&(!b||e.date<=b))
   .sort((x,y)=>(y.date+y.id).localeCompare(x.date+x.id));

 let o='<div class="report" style="margin-top:12px">';
 if(!rows.length){
   o+='<div class="empty">No expenses found for the selected date range.</div>';
 }else{
   o+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">';
   o+='<thead><tr style="border-bottom:2px solid var(--line);text-align:left">';
   o+='<th style="padding:9px 6px">Date</th>';
   o+='<th style="padding:9px 6px">Expense</th>';
   o+='<th style="padding:9px 6px;text-align:right">Amount</th>';
   o+='</tr></thead><tbody>';
   rows.forEach(e=>{
     o+='<tr style="border-bottom:1px solid var(--line)">';
     o+='<td style="padding:9px 6px;white-space:nowrap">'+esc(e.date||"")+'</td>';
     o+='<td style="padding:9px 6px">'+esc(e.expense||"")+'</td>';
     o+='<td style="padding:9px 6px;text-align:right;font-weight:800;white-space:nowrap">'+money(e.amount)+'</td>';
     o+='</tr>';
   });
   o+='</tbody></table></div>';
   const total=rows.reduce((s,e)=>s+Number(e.amount||0),0);
   o+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:12px;border-top:2px solid var(--line);font-weight:850">';
   o+='<span>Total Expense</span><span style="font-size:17px">'+money(total)+'</span></div>';
 }
 o+='</div>';
 $("report").innerHTML=o;
}

$("form").onsubmit=e=>{e.preventDefault();let n=Number($("amount").value);if(!Number.isFinite(n)||n<0)return;data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:$("date").value,expense:$("expense").value.trim(),category:$("category").value,amount:n,notes:$("notes").value.trim()});save();e.target.reset();$("date").value=new Date().toISOString().slice(0,10);$("expense").focus()}
$("view").addEventListener("click",report);$("from").addEventListener("change",report);$("to").addEventListener("change",report);
$("clearReport").addEventListener("click",()=>{$("report").innerHTML="";});

$("pdf").onclick=()=>{
 let a=$("from").value,b=$("to").value;
 if(a&&b&&a>b){alert("From date cannot be after To date.");return}
 let rows=data.filter(e=>(!a||e.date>=a)&&(!b||e.date<=b));
 if(!rows.length){alert("No expenses found for the selected date range.");return}
 if(!window.jspdf){alert("PDF library is still loading. Please try again.");return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
 doc.addFileToVFS("LohitTamil.ttf",LOHIT_TAMIL_B64);
 doc.addFont("LohitTamil.ttf","LohitTamil","normal");
 doc.setFont("LohitTamil","normal");

 const fmtDate=s=>s?s.split("-").reverse().join("/"):"All";
 const total=rows.reduce((s,e)=>s+Number(e.amount||0),0),cats={};
 rows.forEach(e=>cats[e.category]=(cats[e.category]||0)+Number(e.amount||0));

 doc.setFontSize(16);doc.text("Home Expense Ledger V5.14",14,16);
 doc.setFontSize(9);doc.text(`From: ${fmtDate(a)}    To: ${fmtDate(b)}`,14,23);
 doc.setFontSize(11);doc.text(`Total Expense: ₹ ${Number(total).toLocaleString("en-IN",{maximumFractionDigits:2})}`,14,31);

 const body=[...rows].sort((x,y)=>(x.date+x.id).localeCompare(y.date+y.id)).map(e=>[
   fmtDate(e.date||""),e.expense||"",e.category||"",
   Number(e.amount||0).toLocaleString("en-IN",{maximumFractionDigits:2}),
   e.notes||""
 ]);
 doc.autoTable({
   startY:37,
   head:[["Date","Expense","Category","Amount","Notes"]],
   body,
   theme:"grid",
   styles:{font:"LohitTamil",fontStyle:"normal",fontSize:8,cellPadding:2.3,valign:"middle",overflow:"linebreak"},
   headStyles:{font:"LohitTamil",fontStyle:"normal",halign:"center"},
   columnStyles:{0:{cellWidth:24,halign:"center"},1:{cellWidth:39},2:{cellWidth:32},3:{cellWidth:28,halign:"right"},4:{cellWidth:55}},
   margin:{left:14,right:14}
 });
 let y=doc.lastAutoTable.finalY+9;
 if(y>270){doc.addPage();y=18}
 doc.setFont("LohitTamil","normal");doc.setFontSize(11);doc.text("Category-wise Total",14,y);
 y+=5;
 doc.autoTable({
   startY:y,head:[["Category","Total"]],body:Object.entries(cats).sort((x,y)=>y[1]-x[1]).map(([k,v])=>[k,Number(v).toLocaleString("en-IN",{maximumFractionDigits:2})]),
   theme:"grid",styles:{font:"LohitTamil",fontStyle:"normal",fontSize:8,cellPadding:2.3},
   headStyles:{font:"LohitTamil",fontStyle:"normal"},columnStyles:{0:{cellWidth:80},1:{cellWidth:40,halign:"right"}},margin:{left:14,right:14}
 });
 doc.save("Home-Expense-Report.pdf");
};
$("backup").onclick=()=>{let blob=new Blob([JSON.stringify({app:"Home Expense Ledger",version:"4.0",exportedAt:new Date().toISOString(),entries:data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="home-expense-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("restore").onclick=()=>$("file").click();
$("file").onchange=async e=>{
 let f=e.target.files[0]; if(!f)return;
 try{
   let j=JSON.parse(await f.text()), x=Array.isArray(j)?j:j.entries;
   if(!Array.isArray(x))throw 0;
   const map=new Map(data.map(v=>[String(v.id),v]));
   let added=0,updated=0;
   x.forEach(v=>{
     if(!v||v.id==null)return;
     const k=String(v.id);
     if(map.has(k)){map.set(k,v);updated++}else{map.set(k,v);added++}
   });
   data=[...map.values()];
   save();
   alert("Backup restored safely.\nAdded: "+added+"\nUpdated: "+updated+"\nExisting entries were not deleted.");
 }catch{alert("Invalid backup file.")} e.target.value="";
}
render();report();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>
