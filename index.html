<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<title>Home Expense Ledger V3</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--accent:#111827;--soft:#eef2f7;--danger:#fff1f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(145deg,#0b1220,#182337);color:#fff;padding:20px 18px 22px;border-radius:0 0 28px 28px;box-shadow:0 8px 24px #0b122022}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.version{font-size:11px;padding:5px 8px;border:1px solid #ffffff2b;border-radius:999px;color:#cbd5e1}
.sub{font-size:12px;color:#aab4c5;margin-top:4px}.hero{margin-top:20px}.heroLabel{font-size:12px;color:#aab4c5}.heroAmount{font-size:36px;font-weight:850;letter-spacing:-1px;margin-top:2px}.heroBottom{display:flex;justify-content:space-between;color:#cbd5e1;font-size:12px;margin-top:4px}
main{max-width:760px;margin:auto;padding:16px 15px 30px}.card{background:var(--card);border:1px solid #edf0f4;border-radius:22px;padding:17px;margin-bottom:14px;box-shadow:0 7px 24px #1018280a}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.title{font-size:18px;font-weight:800}.pill{font-size:11px;background:var(--soft);padding:6px 9px;border-radius:999px;color:var(--muted);font-weight:700}
label{display:block;font-size:12px;font-weight:750;color:#344054;margin:10px 0 6px}
input,select{width:100%;height:48px;border:1px solid var(--line);background:#fafbfc;border-radius:13px;padding:0 13px;font-size:15px;color:var(--ink);outline:none}
input:focus,select:focus{border-color:#98a2b3;box-shadow:0 0 0 3px #98a2b322}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;height:48px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;margin-top:12px}
.btn.secondary{background:#eef1f5;color:#101828}.btn.small{height:42px;font-size:14px}
.reportBox{background:#f8fafc;border-radius:16px;padding:13px;margin-top:12px}.reportMain{font-size:26px;font-weight:850}.catRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.catRow:last-child{border:0}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.icon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}.itemMain{min-width:0;flex:1}.itemName{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:3px}.itemRight{text-align:right}.amt{font-weight:850;font-size:15px}.del{border:0;background:var(--danger);color:#b42318;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:750;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:22px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}small{color:var(--muted)}
@media(max-width:420px){.grid2{gap:8px}.heroAmount{font-size:34px}}
</style>
</head>
<body>
<header>
 <div class="top"><div><div class="brand">🏠 Home Expense Ledger</div><div class="sub">Simple • Private • Organized</div></div><div class="version">V3 UI</div></div>
 <div class="hero"><div class="heroLabel">TOTAL EXPENSE</div><div class="heroAmount" id="total">₹0</div><div class="heroBottom"><span id="count">0 entries</span><span>Local &amp; private</span></div></div>
</header>
<main>
<section class="card">
 <div class="sectionHead"><div class="title">Add Expense</div><div class="pill">QUICK ENTRY</div></div>
 <form id="form">
  <label>Date</label><input id="date" type="date" required>
  <label>Expense</label><input id="expense" placeholder="What did you spend on?" required>
  <div class="grid2"><div><label>Category</label><select id="category"><option>Grocery</option><option>Vegetables</option><option>Fuel</option><option>EB / Electricity</option><option>Water</option><option>Mobile / Recharge</option><option>House Maintenance</option><option>Medical</option><option>Car</option><option>Travel</option><option>Clothing</option><option>Food / Hotel</option><option>Other</option></select></div><div><label>Amount</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="₹ 0"></div></div>
  <label>Notes <span style="font-weight:500;color:#98a2b3">(optional)</span></label><input id="notes" placeholder="Optional note">
  <button class="btn" type="submit">+ Add Expense</button>
 </form>
</section>

<section class="card">
 <div class="sectionHead"><div class="title">Expense Report</div><div class="pill">DATE RANGE</div></div>
 <div class="grid2"><div><label>From</label><input id="from" type="date"></div><div><label>To</label><input id="to" type="date"></div></div>
 <button class="btn secondary small" id="view" type="button">View Report</button>
 <div id="report"></div>
</section>

<section class="card">
 <div class="sectionHead"><div class="title">Recent Expenses</div><div class="pill" id="listTotal">₹0</div></div>
 <div id="list"></div>
</section>

<section class="card">
 <div class="sectionHead"><div class="title">Data Safety</div><div class="pill">BACKUP</div></div>
 <div class="actions"><button class="btn secondary small" id="backup" type="button">Backup JSON</button><button class="btn secondary small" id="restore" type="button">Restore JSON</button></div>
 <input id="file" type="file" accept=".json,application/json" hidden>
 <p><small>Keep a backup before major app updates. Your ledger stays in this device's browser storage.</small></p>
</section>
</main>
<script>
const KEY="homeExpenseLedgerV1";
const $=x=>document.getElementById(x), money=n=>"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[]}catch(e){data=[]}
const today=new Date().toISOString().slice(0,10);$("date").value=today;$("to").value=today;$("from").value=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
const emoji={Grocery:"🛒",Vegetables:"🥬",Fuel:"⛽","EB / Electricity":"💡",Water:"💧","Mobile / Recharge":"📱","House Maintenance":"🏠",Medical:"💊",Car:"🚗",Travel:"🚌",Clothing:"👕","Food / Hotel":"🍽️",Other:"📦"};
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();report()}
function render(){
 let total=data.reduce((s,e)=>s+Number(e.amount||0),0);$("total").textContent=money(total);$("listTotal").textContent=money(total);$("count").textContent=data.length+" "+(data.length===1?"entry":"entries");
 let box=$("list");box.innerHTML="";if(!data.length){box.innerHTML='<div class="empty">No expenses yet.</div>';return}
 [...data].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).forEach(e=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="icon">${emoji[e.category]||"💰"}</div><div class="itemMain"><div class="itemName">${esc(e.expense)}</div><div class="meta">${esc(e.date)} • ${esc(e.category)}${e.notes?" • "+esc(e.notes):""}</div></div><div class="itemRight"><div class="amt">${money(e.amount)}</div><button class="del" onclick="del('${e.id}')">Delete</button></div>`;box.appendChild(d)})
}
window.del=id=>{if(confirm("Delete this expense?")){data=data.filter(e=>e.id!==id);save()}}
function report(){
 let a=$("from").value,b=$("to").value;if(a&&b&&a>b){$("report").innerHTML='<div class="reportBox" style="color:#b42318">From date cannot be after To date.</div>';return}
 let rows=data.filter(e=>(!a||e.date>=a)&&(!b||e.date<=b)), total=rows.reduce((s,e)=>s+Number(e.amount||0),0),cats={};
 rows.forEach(e=>cats[e.category]=(cats[e.category]||0)+Number(e.amount||0));
 let out=`<div class="reportBox"><div style="font-size:12px;color:#667085">${rows.length} entries</div><div class="reportMain">${money(total)}</div>`;
 if(rows.length){out+='<div style="margin-top:12px;font-weight:800;font-size:13px">Category-wise Total</div>';Object.entries(cats).sort((x,y)=>y[1]-x[1]).forEach(([k,v])=>out+=`<div class="catRow"><span>${esc(k)}</span><b>${money(v)}</b></div>`)}
 out+="</div>";$("report").innerHTML=out
}
$("form").onsubmit=e=>{e.preventDefault();let n=Number($("amount").value);if(!Number.isFinite(n)||n<0)return;data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:$("date").value,expense:$("expense").value.trim(),category:$("category").value,amount:n,notes:$("notes").value.trim()});save();e.target.reset();$("date").value=new Date().toISOString().slice(0,10);$("expense").focus()}
$("view").onclick=report;$("from").onchange=report;$("to").onchange=report;
$("backup").onclick=()=>{let blob=new Blob([JSON.stringify({app:"Home Expense Ledger",version:"3.0",exportedAt:new Date().toISOString(),entries:data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="home-expense-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("restore").onclick=()=>$("file").click();$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text()),x=Array.isArray(j)?j:j.entries;if(!Array.isArray(x))throw 0;if(confirm("Restore backup? Current entries will be replaced.")){data=x;save();alert("Backup restored.")}}catch{alert("Invalid backup file.")}e.target.value=""}
render();report();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(x=>x.update()).catch(()=>{});
</script>
</body>
</html>
