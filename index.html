<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Home Expense Ledger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:20px 16px 18px;position:sticky;top:0;z-index:2}
h1{font-size:22px;margin:0 0 14px}.summary{display:flex;justify-content:space-between;align-items:end}
.total-label{font-size:13px;opacity:.75}.total{font-size:30px;font-weight:800}
main{max-width:720px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 6px}
input,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{border:0;background:#111827;color:white;font-weight:700;cursor:pointer;margin-top:12px}
button.secondary{background:#e5e7eb;color:#111827}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.expense{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}
.expense:last-child{border-bottom:0}.name{font-weight:700}.meta{font-size:12px;color:#6b7280;margin-top:3px}
.amount{font-weight:800;white-space:nowrap}.empty{text-align:center;color:#6b7280;padding:25px 5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
small{color:#6b7280}
</style>
</head>
<body>
<header>
  <h1>🏠 Home Expense Ledger</h1>
  <div class="summary"><div><div class="total-label">Total Expense</div><div class="total" id="total">₹0</div></div><small id="count">0 entries</small></div>
</header>
<main>
  <section class="card">
    <h2 style="margin:0 0 6px;font-size:18px">Add Expense</h2>
    <form id="expenseForm">
      <label>Date</label><input id="date" type="date" required>
      <label>Expense</label><input id="expense" type="text" placeholder="e.g. Grocery" required>
      <div class="row">
        <div><label>Category</label>
          <select id="category">
            <option>Grocery</option><option>Vegetables</option><option>Fuel</option><option>EB / Electricity</option>
            <option>Water</option><option>Mobile / Recharge</option><option>House Maintenance</option><option>Medical</option>
            <option>Car</option><option>Travel</option><option>Clothing</option><option>Food / Hotel</option><option>Other</option>
          </select>
        </div>
        <div><label>Amount</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="₹" required></div>
      </div>
      <label>Notes (optional)</label><input id="notes" type="text" placeholder="Notes">
      <button type="submit">+ Add Expense</button>
    </form>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0;font-size:18px">Expense List</h2><small id="listTotal"></small>
    </div>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 8px;font-size:18px">Data</h2>
    <div class="actions">
      <button class="secondary" type="button" id="exportBtn">Backup JSON</button>
      <button class="secondary" type="button" id="importBtn">Restore JSON</button>
    </div>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
    <p style="margin:10px 0 0"><small>Data is stored locally on this device. Backup before major updates.</small></p>
  </section>
</main>

<script>
const KEY="homeExpenseLedgerV1";
let entries=[];
try{entries=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(entries))entries=[];}catch(e){entries=[];}
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function save(){localStorage.setItem(KEY,JSON.stringify(entries));render();}
function money(n){return "₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});}
function render(){
  const total=entries.reduce((s,e)=>s+Number(e.amount||0),0);
  $("total").textContent=money(total); $("listTotal").textContent=money(total);
  $("count").textContent=entries.length+" "+(entries.length===1?"entry":"entries");
  const list=$("list"); list.innerHTML="";
  if(!entries.length){list.innerHTML='<div class="empty">No expenses yet.</div>';return;}
  [...entries].sort((a,b)=>(b.date+a.id).localeCompare(a.date+b.id)).forEach(e=>{
    const div=document.createElement("div");div.className="expense";
    div.innerHTML=`<div><div class="name">${esc(e.expense)}</div><div class="meta">${e.date} • ${esc(e.category)}${e.notes?" • "+esc(e.notes):""}</div></div>
    <div style="text-align:right"><div class="amount">${money(e.amount)}</div><button style="width:auto;padding:6px 9px;margin-top:6px;font-size:12px;background:#fee2e2;color:#991b1b" onclick="removeEntry('${e.id}')">Delete</button></div>`;
    list.appendChild(div);
  });
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
window.removeEntry=id=>{if(confirm("Delete this expense?")){entries=entries.filter(e=>e.id!==id);save();}};
$("expenseForm").addEventListener("submit",e=>{
 e.preventDefault();
 const amount=Number($("amount").value); if(!Number.isFinite(amount)||amount<0)return;
 entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:$("date").value,expense:$("expense").value.trim(),category:$("category").value,amount,notes:$("notes").value.trim()});
 save(); e.target.reset(); $("date").value=new Date().toISOString().slice(0,10); $("expense").focus();
});
$("exportBtn").onclick=()=>{
 const blob=new Blob([JSON.stringify({app:"Home Expense Ledger",version:1,exportedAt:new Date().toISOString(),entries},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="home-expense-backup.json";a.click();URL.revokeObjectURL(a.href);
};
$("importBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.entries;
   if(!Array.isArray(incoming))throw Error();
   if(!confirm("Restore backup? Current entries will be replaced by the backup."))return;
   entries=incoming;save();alert("Backup restored.");
 }catch(err){alert("Invalid backup file.");}e.target.value="";
};
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
